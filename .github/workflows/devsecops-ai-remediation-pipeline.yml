name: DevSecOps AI Auto-Remediation Pipeline

on:
  push:
    branches-ignore:
      - main
      - "devsecops/ai-fix-*"
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "app/requirements.txt"
      - "scripts/requirements.txt"
      - ".github/workflows/devsecops-ai-remediation-pipeline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "app/requirements.txt"
      - "scripts/requirements.txt"
      - ".github/workflows/devsecops-ai-remediation-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  security-scan-and-remediate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Download source code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: 2. Setup Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"

      - name: 3. Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Installation of Semgrep and AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r scripts/requirements.txt

      - name: 5. Dependency vulnerability audit
        id: dependency_audit
        run: |
          start_time=$(date +%s)
          pip-audit -r app/requirements.txt
          echo "duration=$(( $(date +%s) - start_time ))" >> "$GITHUB_OUTPUT"

      - name: 6. SAST scanning (Semgrep)
        id: initial_semgrep
        run: |
          start_time=$(date +%s)
          semgrep scan \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --json \
            --output semgrep-report.json \
            app/
          echo "duration=$(( $(date +%s) - start_time ))" >> "$GITHUB_OUTPUT"

      - name: 7. Triage and generation of fixes by AI
        id: ai_remediation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          start_time=$(date +%s)
          python scripts/ai_remediation.py
          echo "duration=$(( $(date +%s) - start_time ))" >> "$GITHUB_OUTPUT"

      - name: 8. Verification of the syntax of the corrected code
        run: |
          python -m py_compile app/app.py

      - name: 9. Run security regression tests
        id: security_tests
        run: |
          start_time=$(date +%s)
          pytest -q
          echo "duration=$(( $(date +%s) - start_time ))" >> "$GITHUB_OUTPUT"

      - name: 10. Re-scan remediated code with Semgrep
        id: final_semgrep
        run: |
          start_time=$(date +%s)
          semgrep scan \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --error \
            app/
          echo "duration=$(( $(date +%s) - start_time ))" >> "$GITHUB_OUTPUT"

      - name: 11. Add pipeline metrics to the pull request summary
        run: |
          {
            echo ""
            echo "## Pipeline metrics"
            echo "- Dependency audit: ${{ steps.dependency_audit.outputs.duration }} seconds"
            echo "- Initial Semgrep scan: ${{ steps.initial_semgrep.outputs.duration }} seconds"
            echo "- AI remediation: ${{ steps.ai_remediation.outputs.duration }} seconds"
            echo "- Security tests: ${{ steps.security_tests.outputs.duration }} seconds"
            echo "- Final Semgrep scan: ${{ steps.final_semgrep.outputs.duration }} seconds"
          } >> pr-summary.md

      - name: 12. Create an isolated remediation branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n $(git status --porcelain app/) ]]; then
            BRANCH_NAME="devsecops/ai-fix-${{ github.run_id }}"
            git config user.name "AI DevSecOps Bot"
            git config user.email "devsecops-bot@users.noreply.github.com"
            git checkout -b "$BRANCH_NAME"
            git add app/
            git commit -m "fix(security): automatically fix SAST vulnerabilities by AI"
            git push origin "$BRANCH_NAME"

            gh pr create \
              --title "[AI DevSecOps Bot] Automatically fix security vulnerabilities" \
              --body-file pr-summary.md \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No changes detected in the app/ directory. No pull request will be created."
          fi

  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 1. Download pull request code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: 2. Setup Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"

      - name: 3. Scan pull request for secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r scripts/requirements.txt

      - name: 5. Scan dependencies
        run: |
          pip-audit -r app/requirements.txt

      - name: 6. Verify Python syntax
        run: |
          python -m py_compile app/app.py

      - name: 7. Run security regression tests
        run: |
          pytest -q

      - name: 8. Scan pull request code with Semgrep
        run: |
          semgrep scan \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --error \
            app/
